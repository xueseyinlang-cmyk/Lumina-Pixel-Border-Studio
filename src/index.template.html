<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; worker-src blob:">
<title>像素工坊 · 图片转像素 + 黑边调节</title>
<style>
{{STYLE}}
</style>
</head>
<body>
<header>
  <h1>像素工坊</h1>
  <span class="sub">单文件 · 本地处理 · 图片不出本机</span>
  <span class="spacer"></span>
  <label class="ghost" style="display:inline-flex">
    <input id="fileInput" type="file" accept="image/*" style="display:none">
    <button class="primary" id="btnOpen" type="button">打开图片</button>
  </label>
  <button id="btnPng" type="button">导出 PNG</button>
  <button id="btn1x" type="button">导出 1×</button>
  <button id="btnPalette" type="button">色卡</button>
  <button id="btnEditor" type="button">像素编辑器</button>
  <button id="btnRestore" type="button" disabled>还原自动结果</button>
</header>

<main>
  <aside>
    <h2>网格与采样</h2>
    <div class="row">
      <label for="gridMode">网格</label>
      <select id="gridMode">
        <option value="auto">自动检测</option>
        <option value="manual">手动格子</option>
      </select>
    </div>
    <div class="row">
      <label for="cellW">格子宽 / 高（手动）</label>
      <input id="cellW" type="number" min="1" max="256" step="1">
      <input id="cellH" type="number" min="1" max="256" step="1">
    </div>
    <div class="row">
      <label for="denoise">采样前去噪（修掉模糊与噪点）</label>
      <input id="denoise" type="checkbox">
    </div>

    <h2>调色板与输出</h2>
    <div class="row">
      <label for="colors">颜色数</label>
      <input id="colors" type="range" min="0" max="64" step="1">
      <span class="val" id="colorsOut">24</span>
    </div>
    <div class="hint" id="colorsHint"></div>
    <div class="row">
      <label for="scale">像素格大小</label>
      <input id="scale" type="range" min="1" max="16" step="1">
      <span class="val" id="scaleOut">8 px/格</span>
    </div>
    <div class="hint">每个逻辑像素在输出画布上的边长；改动只重跑渲染。</div>

    <h2>★ 黑边与描边</h2>
    <div class="row">
      <label for="borderEnabled">启用描边</label>
      <input id="borderEnabled" type="checkbox">
    </div>
    <div class="row">
      <label for="borderWidth">粗细</label>
      <input id="borderWidth" type="range" min="0" max="16" step="1">
      <span class="val" id="borderWidthOut">1px</span>
    </div>
    <div class="hint" id="widthHint"></div>
    <div class="row">
      <label for="borderColor">颜色</label>
      <input id="borderColor" type="color">
      <input id="borderOpacity" type="range" min="0" max="1" step="0.01">
      <span class="val" id="borderOpacityOut">100%</span>
    </div>
    <div class="row">
      <label for="borderScope">位置</label>
      <select id="borderScope">
        <option value="grid">全部网格</option>
        <option value="inner">仅内部</option>
        <option value="outer">仅外框</option>
      </select>
    </div>
    <div class="row">
      <label for="borderBlend">混合</label>
      <select id="borderBlend">
        <option value="over">覆盖</option>
        <option value="multiply">正片叠底</option>
        <option value="darken">压暗</option>
      </select>
    </div>
    <div class="row">
      <label for="borderEdgeAware">仅在强对比处描边</label>
      <input id="borderEdgeAware" type="checkbox">
    </div>
    <div class="row">
      <label for="borderEdgeThreshold">对比阈值</label>
      <input id="borderEdgeThreshold" type="range" min="0" max="120" step="1">
      <span class="val" id="borderEdgeThresholdOut">24</span>
    </div>
    <div class="row">
      <label for="borderStyle">描边样式</label>
      <select id="borderStyle">
        <option value="grid">格线黑边</option>
        <option value="cell">块状描边</option>
      </select>
    </div>
    <div class="row">
      <label id="radiusLabel" for="borderRadius" title="交叉点磨圆半径">磨圆半径</label>
      <input id="borderRadius" type="range" min="0" max="16" step="1">
      <span class="val" id="borderRadiusOut">0px</span>
    </div>
    <div class="row">
      <label for="borderSecondEnabled">双色描边</label>
      <input id="borderSecondEnabled" type="checkbox">
    </div>
    <div class="row">
      <label for="borderSecondMode">双色方式</label>
      <select id="borderSecondMode">
        <option value="band">内外色带</option>
        <option value="checker">棋盘交替</option>
      </select>
    </div>
    <div class="row">
      <label for="borderSecondWidth">内色带宽度</label>
      <input id="borderSecondWidth" type="range" min="0" max="16" step="1">
      <span class="val" id="borderSecondWidthOut">1px</span>
    </div>
    <div class="row">
      <label for="borderSecondColor">内色带颜色</label>
      <input id="borderSecondColor" type="color">
    </div>

    <h2>预览与存储</h2>
    <div class="row">
      <label for="previewMaxSide">预览上限 (px)</label>
      <input id="previewMaxSide" type="number" min="512" max="4096" step="128">
    </div>
    <div class="hint" id="storageHint"></div>
  </aside>

  <section id="stage">
    <div id="dropzone">
      <span>把图片拖到这里（或拖到画布上），也可以按 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴</span>
      <span id="dropHint" class="drop-hint"></span>
      <span class="spacer"></span>
      <!-- 预览缩放：适应 / 手动倍率两条路径（滚轮、按钮、快捷键共用 setZoom） -->
      <span class="zoombar" id="zoombar">
        <button id="btnZoomOut" type="button" title="缩小（-）">−</button>
        <button id="btnZoomFit" type="button" class="on" title="适应窗口（0）">适应</button>
        <button id="btnZoomIn" type="button" title="放大（+）">+</button>
        <span id="zoomLabel" class="zoom-label">适应</span>
      </span>
      <span id="fileInfo">未载入图片</span>
    </div>
    <div id="canvasWrap">
      <canvas id="view" width="320" height="320"></canvas>
    </div>
    <!-- 拖放反馈：pointer-events:none，保证 drop 事件仍落在下层元素上 -->
    <div id="dropOverlay" hidden>
      <div class="drop-card">
        <b>松开即可载入图片</b>
        <span>支持 PNG / JPG / WEBP / GIF / SVG，一次 1 张</span>
      </div>
    </div>
    <footer>
      <div class="line">
        <span id="status" class="status">就绪</span>
        <span id="gridInfo"></span>
      </div>
      <div class="line">
        <span id="renderInfo"></span>
      </div>
      <div class="line">
        <span id="noteInfo"></span>
      </div>
    </footer>
  </section>
</main>

<div id="editorPanel" hidden>
  <div class="editor-box">
    <div class="editor-head">
      <button class="tool" data-tool="brush" title="画笔 (B)">画笔</button>
      <button class="tool" data-tool="eraser" title="橡皮 (E)">橡皮</button>
      <button class="tool" data-tool="pick" title="吸管 (I)">吸管</button>
      <button class="tool" data-tool="fill" title="油漆桶 (G)">油漆桶</button>
      <button class="tool" data-tool="line" title="直线 (L)">直线</button>
      <button class="tool" data-tool="rect" title="矩形 (U)">矩形</button>
      <button class="tool" data-tool="ellipse" title="椭圆 (C)">椭圆</button>
      <span style="color:var(--dim);margin-left:6px">笔刷</span>
      <input id="editorBrush" type="range" min="1" max="6" step="1" value="1" style="max-width:90px">
      <span id="editorBrushOut" style="color:var(--dim);min-width:34px">1px</span>
      <span style="color:var(--dim);margin-left:6px">对称</span>
      <select id="editorSym">
        <option value="none">无</option>
        <option value="h">左右</option>
        <option value="v">上下</option>
        <option value="quad">四象限</option>
      </select>
      <span class="spacer"></span>
      <!-- 编辑器缩放：canvas = 逻辑尺寸 × zoom，wrap 用滚动查看；无入口时只能靠打开时的那次自适应 -->
      <span class="zoombar" id="editorZoombar">
        <button id="btnEditorZoomOut" type="button" title="缩小（-）">−</button>
        <button id="btnEditorZoomFit" type="button" title="适应窗口（0）">适应</button>
        <button id="btnEditorZoomIn" type="button" title="放大（+）">+</button>
        <span id="editorZoomLabel" class="zoom-label">12×</span>
      </span>
      <button id="btnUndo" type="button">撤销</button>
      <button id="btnRedo" type="button">重做</button>
    </div>
    <div class="editor-main">
      <div id="editorCanvasWrap"><canvas id="editorCanvas" width="400" height="400"></canvas></div>
      <div class="editor-side">
        <div class="hint" style="margin-top:0">调色板</div>
        <div id="editorPalette"></div>
        <div class="hint">左键绘制 · 右键取色 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销</div>
      </div>
    </div>
    <div class="editor-foot">
      <span>编辑的是逻辑像素图（每格 1 像素），应用后直接参与渲染，不再重新量化。</span>
      <span class="spacer"></span>
      <button id="btnEditorCancel" type="button">取消</button>
      <button id="btnEditorApply" class="primary" type="button">应用 (Enter)</button>
    </div>
  </div>
</div>

<script id="pixel-core">
{{CORE}}
</script>
<script>
{{APP}}
</script>
</body>
</html>
